<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my first website project</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <div class="parent">
        <div class="container">
            <h1>STUDENT PORTFOLIO</h1>
            <img src="student.jpg" alt="Student Photo" class="student-img">
            <h6 id="display-name">Name:</h6>
            <h6 id="display-roll">Roll No:</h6>
            <h6 id="display-subject">Subject:</h6>
            <h6 id="display-group">Group:</h6>
            <h6 id="display-school">School:</h6>
        </div>
        <div class="container">
            <h1>Student Information</h1>

            <p>Submit Your Data</p>
            <input type="text" id="input-name" placeholder="Enter your name">
            
            <br><br>
            
            <input type="text" id="input-roll" placeholder="Enter your Roll Number">
            
            <br><br>
            
            <input type="text" id="input-subject" placeholder="Enter your Favourite Subject">
            
            <br><br>
            
            <input type="text" id="input-group" placeholder="Enter your Group">
            
            
            <br><br>

            <input type="text" id="input-school" placeholder="Enter your School Name">


            <br><br>
            
            
            <button onclick="submitData()">Submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
